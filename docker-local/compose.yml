# RasaHub local development environment.
# Run every `docker compose` command from this directory (docker-local/).

name: rasahub

services:
  web:
    image: nginx:1.30.5-alpine
    container_name: rasahub-web
    depends_on:
      - app
    ports:
      - "127.0.0.1:${APP_PORT:-80}:80"
    volumes:
      - ..:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  app:
    build:
      context: ./php
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    image: rasahub-app
    container_name: rasahub-app
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ..:/var/www/html
      - vendor:/var/www/html/vendor
      - ./php/php.ini:/usr/local/etc/php/conf.d/zz-rasahub.ini:ro
      - ./php/php-fpm.conf:/usr/local/etc/php-fpm.d/zz-rasahub.conf:ro

  mysql:
    image: mysql:9.7.2
    container_name: rasahub-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-rasahub}
      MYSQL_USER: ${MYSQL_USER:-rasahub}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in docker-local/.env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in docker-local/.env}
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/conf.d/rasahub.cnf:/etc/mysql/conf.d/rasahub.cnf:ro
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP ping only succeeds once first-run initialisation has finished.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  vite:
    build:
      context: ./node
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    image: rasahub-vite
    container_name: rasahub-vite
    command: sh -c "[ -d node_modules/.bin ] || npm install; exec npm run dev"
    ports:
      - "127.0.0.1:${VITE_PORT:-5173}:5173"
    volumes:
      - ..:/var/www/html
      - node_modules:/var/www/html/node_modules
      # Tailwind scans framework and Filament views inside vendor/.
      - vendor:/var/www/html/vendor:ro

# Named volumes survive `docker compose down`.
# `docker compose down -v` deletes them, including the database.
volumes:
  mysql_data:
  vendor:
  node_modules:
